<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find My Spot</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 100px; }
    button { font-size: 24px; padding: 12px 24px; }
    #arrow { font-size: 150px; display: inline-block; }
    #distance { font-size: 32px; }
  </style>
</head>
<body>
  <button id="save" disabled>Save spot</button>
  <div id="tracker" hidden>
    <div id="arrow">↑</div>
    <p id="distance"></p>
    <button id="remove">Remove spot</button>
  </div>

  <script>
    const save = document.getElementById("save");
    const remove = document.getElementById("remove");
    const tracker = document.getElementById("tracker");
    const arrow = document.getElementById("arrow");
    const distance = document.getElementById("distance");

    let me = null;
    let spot = null;
    let heading = 0;

    navigator.geolocation.watchPosition(position => {
      me = position.coords;
      save.disabled = false;
      update();
    }, null, { enableHighAccuracy: true });

    function update() {
      if (!spot) return;
      const x = (spot.longitude - me.longitude) * 111320 * Math.cos(me.latitude * Math.PI / 180);
      const y = (spot.latitude - me.latitude) * 110540;
      const bearing = Math.atan2(x, y) * 180 / Math.PI;
      arrow.style.transform = `rotate(${bearing - heading}deg)`;
      distance.textContent = Math.round(Math.hypot(x, y)) + " m";
    }

    save.onclick = async () => {
      if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
        await DeviceOrientationEvent.requestPermission();
      }
      spot = me;
      save.hidden = true;
      tracker.hidden = false;
      update();
    };

    remove.onclick = () => {
      spot = null;
      save.hidden = false;
      tracker.hidden = true;
    };

    window.addEventListener("deviceorientationabsolute", e => {
      heading = 360 - e.alpha;
      update();
    });

    window.addEventListener("deviceorientation", e => {
      if (e.webkitCompassHeading) {
        heading = e.webkitCompassHeading;
        update();
      }
    });
  </script>
</body>
</html>
